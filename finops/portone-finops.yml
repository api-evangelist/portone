tags:
- Payments
- Payment Orchestration
- Korea
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of PortOne spend. Unlike a metered API, PortOne's cost driver is
  payment volume flowing through connected PSPs: card, virtual-account, and
  easy-pay (KakaoPay / NaverPay / Payco) processing fees plus any platform-
  settlement and value-added charges. PortOne itself does not meter API calls,
  so cost management centers on routing volume to the most economical PSP
  channel and reconciling PortOne transaction records against PSP settlement
  statements. Korea settlement currency is KRW.
notes: >-
  PortOne does not publish a numeric KRW rate card; effective per-transaction
  cost is the connected PSP's fee. Reconcile against PSP settlement exports and
  PortOne payment-reconciliation data during review.
sources:
- https://portone.io/korea/en
- https://developers.portone.io/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: PortOne
serviceCategory: Payments and Financial Services
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: KRW
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: PortOne Payment Orchestration
  ServiceCategory: Payments and Financial Services
  ProviderName: PortOne
  PublisherName: PortOne
  InvoiceIssuerName: PortOne (and connected PSPs)
  BillingCurrency: KRW
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: payment_volume
  description: Gross payment amount processed, driving PSP processing fees.
  unit: KRW
  aggregation: sum
  dimensions:
  - merchant
  - psp
  - channel
- name: transaction_count
  description: Number of payment transactions across connected PSP channels.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - psp
  - method
- name: platform_settlement_volume
  description: Funds routed through PortOne Platform partner settlement / payouts.
  unit: KRW
  aggregation: sum
  dimensions:
  - merchant
  - partner
- name: identity_verifications
  description: Korean identity-verification (bon-in injung) requests, which may carry carrier/credit-authority fees.
  unit: verifications
  aggregation: sum
  dimensions:
  - merchant
  - channel
principles:
- name: Visibility
  description: Pull PortOne payment and reconciliation data and match against each PSP's settlement statement to see true landed cost per channel.
- name: Allocation
  description: Tag payments by store / channel / PSP; map to internal cost centers and product lines.
- name: Optimization
  description: Route volume to the lowest-fee suitable PSP channel via PortOne orchestration; consolidate easy-pay methods; batch B2B tax-invoice issuance.
- name: Accountability
  description: Review PSP fee mix and chargeback/cancellation rates monthly; assign owners per merchant store.
maintainers:
