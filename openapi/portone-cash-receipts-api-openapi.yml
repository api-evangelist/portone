        KICC: {}
        SYRUP: {}
        KCP_BILLING: {}
        SMARTRO_V2: {}
        CHAI: {}
        NICE_V2: {}
        KAKAO: {}
        DANAL: {}
        KAKAOPAY: {}
        EXIMBAY: {}
        ALIPAY: {}
        HTML5_INICIS: {}
        WELCOME: {}
        SMARTRO: {}
        PAYLETTER_GLOBAL: {}
        PAYCO: {}
        SMILEPAY: {}
        PAYMENTWALL: {}
        NAVERPAY: {}
        EXIMBAY_V2: {}
        INNOPAY: {}
        KCP_QUICK: {}
        NAVERCO: {}
        DAOU: {}
        GALAXIA: {}
        PINPAY: {}
        MOBILIANS_V2: {}
        INICIS_JP: {}
        SETTLE_ACC: {}
        TOSSPAY_V2: {}
        TOSSPAY: {}
        SETTLE_FIRM: {}
        INICIS: {}
        TOSS_BRANDPAY: {}
        JTNET: {}
        PAYPAL: {}
        DANAL_TPAY: {}
        KCP_DIRECT: {}
        SETTLE: {}
        MOBILIANS: {}
        UPLUS: {}
        HYPHEN: {}
        PAYPAL_V2: {}
        HECTO_GLOBAL: {}
        TRIPLE_A: {}
        KPN: {}
        KICC_V2: {}
        INICIS_V2: {}
        KCP_V2: {}
        INICIS_UNIFIED: {}
        BLUEWALNUT: {}
        NICE: {}
        TOSSPAYMENTS: {}
        PAYPLE: {}
        KSNET: {}
        KCP: {}
    IssueCashReceiptPaymentMethodType:
      title: 현금영수증 발급 가능 결제 수단
      description: 현금영수증 발급 가능 결제 수단
      type: string
      enum:
      - TRANSFER
      - VIRTUAL_ACCOUNT
      x-portone-title: 현금영수증 발급 가능 결제 수단
      x-portone-enum:
        TRANSFER:
          title: 계좌이체
        VIRTUAL_ACCOUNT:
          title: 가상계좌
    CashReceiptType:
      title: 발급 유형
      description: 발급 유형
      type: string
      enum:
      - PERSONAL
      - CORPORATE
      x-portone-title: 발급 유형
      x-portone-enum:
        PERSONAL:
          title: 소득공제용
        CORPORATE:
          title: 지출증빙용
    CashReceiptFilterInput:
      title: 현금영수증 다건 조회를 위한 입력 정보
      description: 현금영수증 다건 조회를 위한 입력 정보
      type: object
      properties:
        storeId:
          type: string
          title: 상점 아이디
          description: Merchant 사용자만 사용가능하며, 지정되지 않은 경우 고객사 전체 현금영수증을 조회합니다.
        timeRangeField:
          $ref: '#/components/schemas/CashReceiptTimeRangeField'
          title: 조회 기준 시점 유형
          description: 값을 입력하지 않으면 ISSUED_AT으로 설정됩니다.
        from:
          type: string
          format: date-time
          title: 조회 기준 시점 범위의 시작
          description: 값을 입력하지 않으면 end의 90일 전으로 설정됩니다.
        until:
          type: string
          format: date-time
          title: 조회 기준 시점 범위의 끝
          description: 값을 입력하지 않으면 현재 시점으로 설정됩니다.
        paymentId:
          type: string
          title: 고객사 결제 아이디
        isTest:
          type: boolean
          title: 테스트 결제 필터링
        orderName:
          type: string
          title: 주문명
        statuses:
          title: 현금영수증 발급 상태 리스트
          type: array
          items:
            $ref: '#/components/schemas/CashReceiptStatus'
          description: 값을 입력하지 않으면 필터링이 적용되지 않습니다.
        isManual:
          type: boolean
          title: 수동 발급 여부
        pgReceiptId:
          type: string
          title: PG사 현금영수증 발급 번호
        pgMerchantId:
          type: string
          title: PG 상점아이디
        pgProviders:
          title: PG사 결제 모듈 리스트
          type: array
          items:
            $ref: '#/components/schemas/PgProvider'
          description: 값을 입력하지 않으면 PG사 결제 모듈 필터링이 적용되지 않습니다.
        pgCompanies:
          title: PG사 리스트
          type: array
          items:
            $ref: '#/components/schemas/PgCompany'
          description: 값을 입력하지 않으면 PG사 필터링이 적용되지 않습니다.
        version:
          $ref: '#/components/schemas/PortOneVersion'
          title: 포트원 버전
        types:
          title: 현금영수증 유형 리스트
          type: array
          items:
            $ref: '#/components/schemas/CashReceiptType'
          description: 값을 입력하지 않으면 필터링이 적용되지 않습니다.
      x-portone-title: 현금영수증 다건 조회를 위한 입력 정보
    IssueCashReceiptError:
      title: IssueCashReceiptError
      oneOf:
      - $ref: '#/components/schemas/CashReceiptAlreadyIssuedError'
      - $ref: '#/components/schemas/ChannelNotFoundError'
      - $ref: '#/components/schemas/ForbiddenError'
      - $ref: '#/components/schemas/InvalidRequestError'
      - $ref: '#/components/schemas/PgProviderError'
      - $ref: '#/components/schemas/UnauthorizedError'
      discriminator:
        propertyName: type
        mapping:
          CASH_RECEIPT_ALREADY_ISSUED: '#/components/schemas/CashReceiptAlreadyIssuedError'
          CHANNEL_NOT_FOUND: '#/components/schemas/ChannelNotFoundError'
          FORBIDDEN: '#/components/schemas/ForbiddenError'
          INVALID_REQUEST: '#/components/schemas/InvalidRequestError'
          PG_PROVIDER: '#/components/schemas/PgProviderError'
          UNAUTHORIZED: '#/components/schemas/UnauthorizedError'
    GetCashReceiptsResponse:
      title: 현금영수증 다건 조회 성공 응답 정보
      description: 현금영수증 다건 조회 성공 응답 정보
      type: object
      required:
      - items
      - page
      properties:
        items:
          title: 조회된 현금영수증 리스트
          type: array
          items:
            $ref: '#/components/schemas/CashReceipt'
        page:
          $ref: '#/components/schemas/PageInfo'
          title: 조회된 페이지 정보
      x-portone-title: 현금영수증 다건 조회 성공 응답 정보
    GetCashReceiptsBody:
      title: GetCashReceiptsBody
      description: 현금영수증 다건 조회를 위한 입력 정보
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageInput'
          title: 요청할 페이지 정보
          description: '미 입력 시 number: 0, size: 10 으로 기본값이 적용됩니다.'
        sort:
          $ref: '#/components/schemas/CashReceiptSortInput'
          title: 정렬 조건
          description: '미 입력 시 sortBy: ISSUED_AT, sortOrder: DESC 으로 기본값이 적용됩니다.'
        filter:
          $ref: '#/components/schemas/CashReceiptFilterInput'
          title: 조회할 현금영수증 조건 필터
      x-portone-description: 현금영수증 다건 조회를 위한 입력 정보
    IssueCashReceiptResponse:
      title: 현금 영수증 발급 성공 응답
      description: 현금 영수증 발급 성공 응답
      type: object
      required:
      - cashReceipt
      properties:
        cashReceipt:
          $ref: '#/components/schemas/CashReceiptSummary'
      x-portone-title: 현금 영수증 발급 성공 응답
    IssueCashReceiptCustomerInputIdentityNumberType:
      title: 현금영수증 발급 시 고객 식별 정보 유형
      description: 현금영수증 발급 시 고객 식별 정보 유형
      type: string
      enum:
      - PHONE
      - CARD
      - BUSINESS
      x-portone-title: 현금영수증 발급 시 고객 식별 정보 유형
      x-portone-enum:
        PHONE:
          title: 휴대전화번호
        CARD:
          title: 카드번호
        BUSINESS:
          title: 사업자등록번호
    IssueFailedCashReceipt:
      title: 발급 실패
      description: 발급 실패
      type: object
      required:
      - status
      - merchantId
      - storeId
      - paymentId
      - orderName
      - isManual
      properties:
        status:
          type: string
          title: 현금영수증 상태
        merchantId:
          type: string
          title: 고객사 아이디
        storeId:
          type: string
          title: 상점 아이디
        paymentId:
          type: string
          title: 결제 건 아이디
        channel:
          $ref: '#/components/schemas/SelectedChannel'
          title: 현금영수증 발급에 사용된 채널
        orderName:
          type: string
          title: 주문명
        isManual:
          type: boolean
          title: 수동 발급 여부
        statusUpdatedAt:
          type: string
          format: date-time
          title: 상태 업데이트 시점
      x-portone-title: 발급 실패
    CancelledCashReceipt:
      title: 발급 취소
      description: 발급 취소
      type: object
      required:
      - status
      - merchantId
      - storeId
      - paymentId
      - channel
      - amount
      - currency
      - orderName
      - isManual
      - issueNumber
      - issuedAt
      - cancelledAt
      properties:
        status:
          type: string
          title: 현금영수증 상태
        merchantId:
          type: string
          title: 고객사 아이디
        storeId:
          type: string
          title: 상점 아이디
        paymentId:
          type: string
          title: 결제 건 아이디
        channel:
          $ref: '#/components/schemas/SelectedChannel'
          title: 현금영수증 발급에 사용된 채널
        amount:
          type: integer
          format: int64
          title: 결제 금액
        taxFreeAmount:
          type: integer
          format: int64
          title: 면세액
        vatAmount:
          type: integer
          format: int64
          title: 부가세액
        currency:
          $ref: '#/components/schemas/Currency'
          title: 통화
        orderName:
          type: string
          title: 주문명
        isManual:
          type: boolean
          title: 수동 발급 여부
        type:
          $ref: '#/components/schemas/CashReceiptType'
          title: 현금영수증 유형
        pgReceiptId:
          type: string
          title: PG사 현금영수증 아이디
        issueNumber:
          type: string
          title: 승인번호
        url:
          type: string
          title: 현금영수증 URL
        issuedAt:
          type: string
          format: date-time
          title: 발급 시점
        cancelledAt:
          type: string
          format: date-time
          title: 취소 시점
        statusUpdatedAt:
          type: string
          format: date-time
          title: 상태 업데이트 시점
      x-portone-title: 발급 취소
    PageInput:
      title: 다건 조회 API 에 사용되는 페이지 입력 정보
      description: 다건 조회 API 에 사용되는 페이지 입력 정보
      type: object
      properties:
        number:
          type: integer
          format: int32
          title: 0부터 시작하는 페이지 번호
        size:
          type: integer
          format: int32
          title: 각 페이지 당 포함할 객체 수
      x-portone-title: 다건 조회 API 에 사용되는 페이지 입력 정보
    CashReceiptStatus:
      title: 현금영수증 발급 건 상태
      description: 현금영수증 발급 건 상태
      type: string
      enum:
      - ISSUED
      - CANCELLED
      - FAILED
      x-portone-title: 현금영수증 발급 건 상태
      x-portone-enum:
        ISSUED: {}
        CANCELLED: {}
        FAILED: {}
    PgCompany:
      title: PG사
      description: PG사
      type: string
      enum:
      - INICIS
      - NICE
      - KCP
      - DANAL
      - TOSSPAYMENTS
      - MOBILIANS
      - KICC
      - SMARTRO
      - DAOU
      - BLUEWALNUT
      - PAYPAL
      - ALIPAY
      - EXIMBAY
      - PAYMENTWALL
      - SETTLE
      - GALAXIA
      - NAVERPAY
      - KAKAOPAY
      - SMILEPAY
      - KAKAO
      - TOSSPAY
      - CHAI
      - PAYCO
      - PAYPLE
      - SYRUP
      - KSNET
      - WELCOME
      - JTNET
      - KPN
      - HYPHEN
      - PAYLETTER
      - TRIPLE_A
      - INNOPAY
      x-portone-title: PG사
      x-portone-enum:
        KICC: {}
        ALIPAY: {}
        SYRUP: {}
        PAYCO: {}
        PAYLETTER: {}
        CHAI: {}
        TOSSPAY: {}
        INICIS: {}
        SETTLE: {}
        KAKAO: {}
        DANAL: {}
        BLUEWALNUT: {}
        KAKAOPAY: {}
        EXIMBAY: {}
        WELCOME: {}
        SMARTRO: {}
        SMILEPAY: {}
