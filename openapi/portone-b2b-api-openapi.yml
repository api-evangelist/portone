        required: true
        schema:
          type: string
        x-portone-title: 일괄 세금계산서 아이디
      - name: test
        in: query
        description: '테스트 모드 여부


          true 이면 테스트 모드로 실행되며, false 이거나 주어지지 않은 경우 테스트 모드를 사용하지 않습니다.'
