openapi: 3.0.3
info:
  title: PortOne B2b Identity Verifications API
  version: 1.16.0
servers:
- url: https://api.portone.io
  description: 운영환경 서버
tags:
- name: Identity Verifications
paths:
  /identity-verifications/{identityVerificationId}/confirm:
    post:
      summary: 본인인증 확인
      description: '본인인증 확인


        요청된 본인인증에 대한 확인을 진행합니다.'
      operationId: confirmIdentityVerification
      parameters:
      - name: identityVerificationId
        in: path
        description: 본인인증 아이디
        required: true
        schema:
          type: string
        x-portone-title: 본인인증 아이디
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmIdentityVerificationBody'
        required: true
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityVerificationResponse'
          x-portone-title: 성공 응답
        '400':
          description: '* `InvalidRequestError`: 요청된 입력 정보가 유효하지 않은 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityVerificationError'
        '401':
          description: '* `UnauthorizedError`: 인증 정보가 올바르지 않은 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityVerificationError'
        '403':
          description: '* `ForbiddenError`: 요청이 거절된 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityVerificationError'
        '404':
          description: '* `IdentityVerificationNotFoundError`: 요청된 본인인증 건이 존재하지 않는 경우

            * `IdentityVerificationNotSentError`: 본인인증 건이 API로 요청된 상태가 아닌 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityVerificationError'
        '409':
          description: '* `IdentityVerificationAlreadyVerifiedError`: 본인인증 건이 이미 인증 완료된 상태인 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityVerificationError'
        '502':
          description: '* `PgProviderError`: PG사에서 오류를 전달한 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmIdentityVerificationError'
      security:
      - bearerJwt: []
      - portOne: []
      x-portone-category: identityVerification
      x-portone-title: 본인인증 확인
      x-portone-description: 요청된 본인인증에 대한 확인을 진행합니다.
      x-portone-error:
        $ref: '#/components/schemas/ConfirmIdentityVerificationError'
      tags:
      - Identity Verifications
  /identity-verifications/{identityVerificationId}/resend:
    post:
      summary: SMS 본인인증 요청 재전송
      description: 'SMS 본인인증 요청 재전송


        SMS 본인인증 요청을 재전송합니다.'
      operationId: resendIdentityVerification
      parameters:
      - name: identityVerificationId
        in: path
        description: 본인인증 아이디
        required: true
        schema:
          type: string
        x-portone-title: 본인인증 아이디
      - name: storeId
        in: query
        description: '상점 아이디


          접근 권한이 있는 상점 아이디만 입력 가능하며, 미입력시 인증 정보의 상점 아이디를 사용합니다.'
        required: false
        schema:
          type: string
        x-portone-title: 상점 아이디
        x-portone-description: 접근 권한이 있는 상점 아이디만 입력 가능하며, 미입력시 인증 정보의 상점 아이디를 사용합니다.
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendIdentityVerificationResponse'
          x-portone-title: 성공 응답
        '400':
          description: '* `InvalidRequestError`: 요청된 입력 정보가 유효하지 않은 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendIdentityVerificationError'
        '401':
          description: '* `UnauthorizedError`: 인증 정보가 올바르지 않은 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendIdentityVerificationError'
        '403':
          description: '* `ForbiddenError`: 요청이 거절된 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendIdentityVerificationError'
        '404':
          description: '* `IdentityVerificationNotFoundError`: 요청된 본인인증 건이 존재하지 않는 경우

            * `IdentityVerificationNotSentError`: 본인인증 건이 API로 요청된 상태가 아닌 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendIdentityVerificationError'
        '409':
          description: '* `IdentityVerificationAlreadyVerifiedError`: 본인인증 건이 이미 인증 완료된 상태인 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendIdentityVerificationError'
        '502':
          description: '* `PgProviderError`: PG사에서 오류를 전달한 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendIdentityVerificationError'
      security:
      - bearerJwt: []
      - portOne: []
      x-portone-category: identityVerification
      x-portone-title: SMS 본인인증 요청 재전송
      x-portone-description: SMS 본인인증 요청을 재전송합니다.
      x-portone-error:
        $ref: '#/components/schemas/ResendIdentityVerificationError'
      tags:
      - Identity Verifications
  /identity-verifications/{identityVerificationId}/send:
    post:
      summary: 본인인증 요청 전송
      description: '본인인증 요청 전송


        SMS 또는 APP 방식을 이용하여 본인인증 요청을 전송합니다.'
      operationId: sendIdentityVerification
      parameters:
      - name: identityVerificationId
        in: path
        description: 본인인증 아이디
        required: true
        schema:
          type: string
        x-portone-title: 본인인증 아이디
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendIdentityVerificationBody'
        required: true
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendIdentityVerificationResponse'
          x-portone-title: 성공 응답
        '400':
          description: '* `InvalidRequestError`: 요청된 입력 정보가 유효하지 않은 경우

            * `MaxTransactionCountReachedError`: 결제 혹은 본인인증 시도 횟수가 최대에 도달한 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendIdentityVerificationError'
        '401':
          description: '* `UnauthorizedError`: 인증 정보가 올바르지 않은 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendIdentityVerificationError'
        '403':
          description: '* `ForbiddenError`: 요청이 거절된 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendIdentityVerificationError'
        '404':
          description: '* `IdentityVerificationNotFoundError`: 요청된 본인인증 건이 존재하지 않는 경우

            * `ChannelNotFoundError`: 요청된 채널이 존재하지 않는 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendIdentityVerificationError'
        '409':
          description: '* `IdentityVerificationAlreadyVerifiedError`: 본인인증 건이 이미 인증 완료된 상태인 경우

            * `IdentityVerificationAlreadySentError`: 본인인증 건이 이미 API로 요청된 상태인 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendIdentityVerificationError'
        '502':
          description: '* `PgProviderError`: PG사에서 오류를 전달한 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendIdentityVerificationError'
      security:
      - bearerJwt: []
      - portOne: []
      x-portone-category: identityVerification
      x-portone-title: 본인인증 요청 전송
      x-portone-description: SMS 또는 APP 방식을 이용하여 본인인증 요청을 전송합니다.
      x-portone-error:
        $ref: '#/components/schemas/SendIdentityVerificationError'
      tags:
      - Identity Verifications
  /identity-verifications/{identityVerificationId}:
    get:
      summary: 본인인증 단건 조회
      description: '본인인증 단건 조회


        주어진 아이디에 대응되는 본인인증 내역을 조회합니다.'
      operationId: getIdentityVerification
      parameters:
      - name: identityVerificationId
        in: path
        description: 조회할 본인인증 아이디
        required: true
        schema:
          type: string
        example: your-identity-verification-id
        x-portone-title: 조회할 본인인증 아이디
      - name: storeId
        in: query
        description: '상점 아이디


          접근 권한이 있는 상점 아이디만 입력 가능하며, 미입력시 인증 정보의 상점 아이디를 사용합니다.'
        required: false
        schema:
          type: string
        example: your-store-id
        x-portone-title: 상점 아이디
        x-portone-description: 접근 권한이 있는 상점 아이디만 입력 가능하며, 미입력시 인증 정보의 상점 아이디를 사용합니다.
      responses:
        '200':
          description: 성공 응답으로 본인 인증 객체를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVerification'
          x-portone-description: 성공 응답으로 본인 인증 객체를 반환합니다.
        '400':
          description: '* `InvalidRequestError`: 요청된 입력 정보가 유효하지 않은 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityVerificationError'
        '401':
          description: '* `UnauthorizedError`: 인증 정보가 올바르지 않은 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityVerificationError'
        '403':
          description: '* `ForbiddenError`: 요청이 거절된 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityVerificationError'
        '404':
          description: '* `IdentityVerificationNotFoundError`: 요청된 본인인증 건이 존재하지 않는 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityVerificationError'
      security:
      - bearerJwt: []
      - portOne: []
      x-portone-category: identityVerification
      x-portone-title: 본인인증 단건 조회
      x-portone-description: 주어진 아이디에 대응되는 본인인증 내역을 조회합니다.
      x-portone-error:
        $ref: '#/components/schemas/GetIdentityVerificationError'
      tags:
      - Identity Verifications
  /identity-verifications:
    get:
      summary: 본인인증 내역 다건 조회
      description: '본인인증 내역 다건 조회


        주어진 조건에 맞는 본인인증 내역들을 페이지 기반으로 조회합니다.'
      operationId: getIdentityVerifications
      parameters:
      - name: requestBody
        in: query
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetIdentityVerificationsBody'
      responses:
        '200':
          description: 성공 응답으로 조회된 본인인증 내역 리스트와 페이지 정보가 반환됩니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityVerificationsResponse'
          x-portone-title: 성공 응답으로 조회된 본인인증 내역 리스트와 페이지 정보가 반환됩니다.
        '400':
          description: '* `InvalidRequestError`: 요청된 입력 정보가 유효하지 않은 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityVerificationsError'
        '401':
          description: '* `UnauthorizedError`: 인증 정보가 올바르지 않은 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityVerificationsError'
        '403':
          description: '* `ForbiddenError`: 요청이 거절된 경우'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIdentityVerificationsError'
      security:
      - bearerJwt: []
      - portOne: []
      x-portone-category: identityVerification
      x-portone-title: 본인인증 내역 다건 조회
      x-portone-description: 주어진 조건에 맞는 본인인증 내역들을 페이지 기반으로 조회합니다.
      x-portone-error:
        $ref: '#/components/schemas/GetIdentityVerificationsError'
      tags:
      - Identity Verifications
components:
  schemas:
    IdentityVerificationSortBy:
      title: 본인인증 내역 정렬 기준
      description: 본인인증 내역 정렬 기준
      type: string
      enum:
      - REQUESTED_AT
      - VERIFIED_AT
      - FAILED_AT
      - STATUS_UPDATED_AT
      x-portone-title: 본인인증 내역 정렬 기준
      x-portone-enum:
        REQUESTED_AT:
          title: 요청 시각
        VERIFIED_AT:
          title: 완료 시각
        FAILED_AT:
          title: 실패 시각
        STATUS_UPDATED_AT:
          title: 상태 변경 시각
          description: 요청 상태의 경우 REQUESTED_AT, 완료 상태의 경우 VERIFIED_AT, 실패 상태의 경우 FAILED_AT
    IdentityVerification:
      title: 본인인증 내역
      description: 본인인증 내역
      oneOf:
      - $ref: '#/components/schemas/FailedIdentityVerification'
      - $ref: '#/components/schemas/ReadyIdentityVerification'
      - $ref: '#/components/schemas/VerifiedIdentityVerification'
      discriminator:
        propertyName: status
        mapping:
          FAILED: '#/components/schemas/FailedIdentityVerification'
          READY: '#/components/schemas/ReadyIdentityVerification'
          VERIFIED: '#/components/schemas/VerifiedIdentityVerification'
      x-portone-title: 본인인증 내역
      x-portone-discriminator:
        READY:
          title: 준비 상태의 본인인증 내역
        VERIFIED:
          title: 완료된 본인인증 내역
        FAILED:
          title: 실패한 본인인증 내역
    IdentityVerificationOperator:
      title: 본인인증 통신사
      description: 본인인증 통신사
      type: string
      enum:
      - SKT
      - KT
      - LGU
      - SKT_MVNO
      - KT_MVNO
      - LGU_MVNO
      x-portone-title: 본인인증 통신사
      x-portone-enum:
        SKT:
          title: SKT
        KT:
          title: KT
        KT_MVNO:
          title: KT 알뜰폰
        LGU_MVNO:
          title: LGU 알뜰폰
        SKT_MVNO:
          title: SKT 알뜰폰
        LGU:
          title: LGU
    ResendIdentityVerificationResponse:
      title: 본인인증 요청 재전송 성공 응답
      description: 본인인증 요청 재전송 성공 응답
      type: object
      x-portone-title: 본인인증 요청 재전송 성공 응답
    PgProvider:
      title: PG사 결제 모듈
      description: PG사 결제 모듈
      type: string
      enum:
      - HTML5_INICIS
      - PAYPAL
      - PAYPAL_V2
      - INICIS
      - DANAL
      - NICE
      - DANAL_TPAY
      - JTNET
