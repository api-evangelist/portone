aid: portone
url: https://raw.githubusercontent.com/api-evangelist/portone/refs/heads/main/apis.yml
name: PortOne
kind: company
description: PortOne (formerly Iamport) is a Korea-based payment orchestration platform
  that lets online businesses integrate one API to reach 100+ Korean and global payment
  methods and PSPs. The V2 REST API (api.portone.io) covers payments, billing keys,
  scheduled/recurring payments, identity verification, cash receipts, B2B tax invoices,
  and partner settlement, with the legacy V1 API still served at api.iamport.kr.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Payment Orchestration
- Fintech
- Korea
- Billing
- Identity Verification
created: '2026-07-17'
modified: '2026-07-17'
specificationVersion: '0.19'
apis:
- aid: portone:portone-payments-api
  name: PortOne Payments API (V2)
  tags:
  - Payments
  - Cancellation
  - Escrow
  - Virtual Account
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.portone.io/api/rest-v2/payment
  baseURL: https://api.portone.io
  properties:
  - url: https://developers.portone.io/api/rest-v2/payment
    type: Documentation
  - url: https://developers.portone.io/api/rest-v2
    type: APIReference
  - url: openapi/portone-openapi.yml
    type: OpenAPI
  - url: collections/portone.postman_collection.json
    type: PostmanCollection
  description: Core payment lifecycle over api.portone.io — single/bulk payment lookup,
    manual (keyed) payments, capture, cancellation, escrow, virtual-account close,
    and cash-receipt issuance, keyed by merchant-supplied paymentId.
