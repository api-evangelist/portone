  - url: https://developers.portone.io/api/rest-v1
    type: Documentation
  - url: https://developers.portone.io/api/rest-v1/payment
    type: APIReference
  description: Legacy V1 (Iamport) REST API on api.iamport.kr — token-authenticated
    (POST /users/getToken with imp_key/imp_secret) payment lookup, cancellation, non-authenticated
    and scheduled payments, virtual accounts, and identity verification. Maintained
    for existing integrations; new integrations are directed to V2.
